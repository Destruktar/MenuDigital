<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--SEO Meta-->
    <meta name="description"
        content="Magnolia cafe resto: un ambiente elegante con comida deliciosa y café de calidad. Visitanos en El Tio, Córdoba, Argentina.">
    <meta name="keywords"
        content="restaurante, cafe, comida casera, postres, desayuno, cena, Magnolia, Magnolia cafe resto, El Tio, Cordoba, Argentina">
    <meta name="author" content="Magnolia Cafe Resto">
    <meta name="robots" content="index, follow">
    <!--Favicon-->
    <link rel="icon" type="image/png" sizes="32x32" href="src/img/favicon/favicon-32x32-white.png">
    <link rel="apple-touch-icon" sizes="180x180" href="src/img/favicon/apple-touch-icon.png">
    <title>Menú Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,100..700;1,100..700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../build/css/app.css">
</head>

<body>
    <main class="container main__container">
        <h2>Administrador de platillos</h2>
        <button id="addProduct">Añadir platillo</button>
        <button id="logOut">Salir</button>

        <form id="platilloForm">
            <input type="text" id="nombrePlatillo" placeholder="Nombre del platillo" required>
            <input type="text" id="descripcionPlatillo" placeholder="Descripción del platillo" required>
            <select id="categoriaPlatillo">
                <option value="">Seleccionar categoría</option>
                <option value="cafeteria">Cafetería</option>
                <option value="jugos">Jugos</option>
                <option value="combos">Combos</option>
                <option value="tostados-carlitos">Tostados Carlitos</option>
                <option value="aperitivos">Aperitivos</option>
                <option value="menu">Menú</option>
                <option value="sandwiches">Sandwiches</option>
                <option value="tablas">Tablas</option>
                <option value="cazuelas">Cazuelas</option>
                <option value="pizzas">Pizzas</option>
                <option value="infantil">Infantil</option>
                <option value="postres">Postres</option>
                <option value="bebidas">Bebidas</option>
                <option value="cervezas">Cervezas</option>
                <option value="licores-aperitivos">Licores Aperitivos</option>
                <option value="vinos">Vinos</option>
                <option value="cocteles">Cocteles</option>
                <option value="moktails">Moktails</option>
            </select>
            <input type="text" id="subcatPlatillo" placeholder="Subcategoría" required>
            <input type="number" id="precioPlatillo" placeholder="Precio del platillo" required>

            <!-- Botón para enviar el formulario -->
        </form>

        <table>
            <thead>
                <tr>
                    <th id="sortName">Nombre</th>
                    <th id="sortPrice">Precio</th>
                    <th id="sortCategory">Categoria</th>
                    <th>Descripción</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

    </main>
    <script type="module" src="../src/js/dashboard.js"></script>
</body>

</html>
